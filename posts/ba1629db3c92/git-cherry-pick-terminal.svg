<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Git terminal scene</title>
  <desc id="desc">A terminal-like panel with commit graph blocks and command lines for article illustration.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <style>
      .mono { font: 500 24px Menlo, Monaco, Consolas, monospace; fill: #e2e8f0; }
      .tag { font: 600 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg2)"/>
  <rect x="110" y="90" width="1060" height="540" rx="20" fill="#0f172a"/>
  <rect x="110" y="90" width="1060" height="52" rx="20" fill="#1e293b"/>
  <circle cx="150" cy="116" r="8" fill="#fb7185"/>
  <circle cx="176" cy="116" r="8" fill="#fbbf24"/>
  <circle cx="202" cy="116" r="8" fill="#34d399"/>

  <text x="160" y="200" class="mono">$ git checkout main</text>
  <text x="160" y="245" class="mono">$ git cherry-pick a1b2c3d</text>
  <text x="160" y="290" class="mono">$ git log --oneline</text>

  <line x1="190" y1="380" x2="1040" y2="380" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <circle cx="340" cy="380" r="10" fill="#60a5fa"/>
  <circle cx="500" cy="380" r="10" fill="#60a5fa"/>
  <circle cx="670" cy="380" r="10" fill="#60a5fa"/>
  <circle cx="860" cy="380" r="12" fill="#22d3ee" stroke="#0891b2" stroke-width="2"/>

  <line x1="430" y1="500" x2="980" y2="500" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <circle cx="560" cy="500" r="10" fill="#34d399"/>
  <circle cx="760" cy="500" r="10" fill="#34d399"/>

  <rect x="920" y="330" width="180" height="44" rx="10" fill="#155e75"/>
  <text x="945" y="359" class="tag" fill="#ecfeff">picked commit</text>
</svg>
