<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Git cherry-pick flow diagram</title>
  <desc id="desc">A clean branch timeline showing one commit copied from feature to main.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#e6f4ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .label { font: 600 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0f172a; }
      .small { font: 500 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="80" y="80" width="1120" height="560" rx="24" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="140" y="150" class="label">cherry-pick: copy one commit from feature to main</text>

  <line x1="180" y1="270" x2="1080" y2="270" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
  <line x1="180" y1="430" x2="1080" y2="430" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/>

  <text x="120" y="278" class="small">main</text>
  <text x="120" y="438" class="small">feature</text>

  <circle cx="360" cy="270" r="14" fill="#1d4ed8"/>
  <circle cx="520" cy="270" r="14" fill="#1d4ed8"/>
  <circle cx="700" cy="270" r="14" fill="#1d4ed8"/>

  <circle cx="380" cy="430" r="14" fill="#0f766e"/>
  <circle cx="560" cy="430" r="14" fill="#0f766e"/>
  <circle cx="760" cy="430" r="14" fill="#0f766e"/>
  <circle cx="920" cy="430" r="14" fill="#0f766e"/>

  <circle cx="880" cy="270" r="18" fill="#14b8a6" stroke="#0f766e" stroke-width="3"/>
  <path d="M760 430 C 800 370, 830 330, 870 290" fill="none" stroke="#0f766e" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>

  <text x="760" y="510" class="small">selected commit</text>
  <text x="860" y="245" class="small">copied here</text>
</svg>
